services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www
    ports:
      - "8000:8000"
    volumes:
      - ./:/var/www
    depends_on:
      - postgres
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trainingos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - trainingos_pg:/var/lib/postgresql/data
volumes:
  trainingos_pg:
